[package]
name = "unicast"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "unicast"
path = "src/bin/unicast.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.27"

# Keep these only for Unix targets so the project still compiles on Windows
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal"] }
libc = "0.2"